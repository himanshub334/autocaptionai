version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autocaption-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: autocaption
      POSTGRES_USER: autocaption
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autocaption_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/models/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocaption"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (job queue) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autocaption-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible storage) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: autocaption-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-autocaption}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-autocaption_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── AI Service (Python / Faster-Whisper) ────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: autocaption-ai
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      MODEL_SIZE: ${WHISPER_MODEL:-base}
      DEVICE: ${DEVICE:-cpu}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-int8}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autocaption}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autocaption_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-autocaption-videos}
    volumes:
      - ./ai-service:/app
      - whisper_models:/root/.cache/huggingface
      - ai_output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 2G

  # ─── AI Worker (RQ background processing) ────────────────────
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: autocaption-ai-worker
    restart: unless-stopped
    command: python start_worker.py
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      MODEL_SIZE: ${WHISPER_MODEL:-base}
      DEVICE: ${DEVICE:-cpu}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-int8}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autocaption}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autocaption_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-autocaption-videos}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./ai-service:/app
      - whisper_models:/root/.cache/huggingface
      - ai_output:/app/output
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 2G

  # ─── Backend (Node.js / Express) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autocaption-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://autocaption:${DB_PASSWORD:-autocaption_secret}@postgres:5432/autocaption
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_refresh_secret_change_in_production}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autocaption}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autocaption_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-autocaption-videos}
      MINIO_USE_SSL: "false"
      AI_SERVICE_URL: http://ai-service:8000
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-500}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - upload_temp:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4000:4000"

  # ─── Frontend (React) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: autocaption-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Nginx (reverse proxy) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: autocaption-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whisper_models:
  ai_output:
  upload_temp:
